version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # 双向流的 envelope 消息用 AgentMessage/ServerMessage 表达「信道消息」语义，
    # 比 OpenChannelRequest/Response 更清晰，故豁免命名规则。
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # 正/反向两个 channel（OpenChannel / OpenForwardChannel）复用同一套 envelope，
    # 是决策 002「信令协议同构」的体现，豁免唯一性规则。
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
