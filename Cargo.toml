[workspace]
resolver = "2"
members = ["proto", "server", "agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# async runtime
tokio = { version = "1.53", features = ["full"] }
tokio-stream = "0.1"

# gRPC
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
http = "1"

# HTTP
axum = { version = "0.8", features = ["ws"] }

# storage
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "uuid", "json"] }

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# config / cli
clap = { version = "4.6", features = ["derive", "env"] }

# errors
thiserror = "2"
anyhow = "1"

# misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
hostname = "0.4"
bcrypt = "0.19"
sysinfo = "0.39"
sha2 = "0.11"
hex = "0.4"

# pty (interactive terminal)
portable-pty = "0.9"

# tls / certificate (mTLS)
rcgen = { version = "0.14", features = ["crypto", "pem", "x509-parser"] }
time = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# console encoding (Windows OEM codepage decode)
encoding_rs = "0.8"
