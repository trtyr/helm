      summary: 从 Agent 下载文件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, remote_path, local_path]
              properties:
                agent_id: { type: string }
                remote_path: { type: string }
                local_path: { type: string }
      responses:
        "200":
          description: 下载完成（含 SHA256 校验结果）
          content:
            application/json:
              schema:
                type: object
                properties:
                  checksum_ok: { type: boolean }

  /api/v1/files/list:
    post:
      tags: [files]
      summary: 列目录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, path]
              properties:
                agent_id: { type: string }
                path: { type: string }
      responses:
        "200":
          description: 目录条目
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/FileEntry" }

  /api/v1/tasks/script:
    post:
      tags: [tasks]
      summary: 下发脚本任务
      requestBody:
        required: true
        content:
