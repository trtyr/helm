          schema: { type: string }
      responses:
        "200":
          description: 通知列表（按时间倒序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  total:
