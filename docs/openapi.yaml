  /api/v1/notifications/read-all:
    post:
      tags: [notifications]
      summary: 全部通知标记已读
      responses:
        "200":
          description: 已标记
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  /api/v1/api-keys:
    get:
      tags: [api-keys]
      summary: 分页列出 API key（仅 JWT；只回展示前缀，不含哈希/明文）
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: API key 列表（按创建时间倒序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
    post:
      tags: [api-keys]
      summary: 创建 API key（仅 JWT；明文 key 仅本次响应返回一次）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                expires_at:
                  type: string
                  format: date-time
                  description: RFC 3339 过期时间，空则永不过期
                scopes:
                  type: array
                  items: { $ref: "#/components/schemas/ApiKeyScope" }
                  description: 功能域 scope；空 = 全功能（兼容存量 key）
      responses:
        "200":
          description: 创建成功（key 为明文，仅此一次）
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { $ref: "#/components/schemas/ApiKey" }
                  key: { type: string, example: "helm_3f9a..." }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ApiKeyId"
    get:
      tags: [api-keys]
      summary: API key 详情（仅 JWT）
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { $ref: "#/components/schemas/ApiKey" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [api-keys]
      summary: 吊销 API key（仅 JWT；幂等，已吊销仍返回 ok）
      responses:
        "200":
          description: 已吊销
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    HostId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: id
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ListenerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApiKeyId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
    Unauthorized:
      description: 未授权
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: object }
    InvalidArgument:
      description: 请求参数不合法
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: object }
    NotFound:
      description: 未找到
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: object }
    NotConnected:
      description: Agent 离线
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: object }
  schemas:
    Host:
      type: object
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        platform: { type: string }
        tags: { type: array, items: { type: string } }
        conn_mode: { type: string, enum: [reverse, forward] }
        addr: { type: string }
        public_ip: { type: string, description: Server 看到的 Agent 连接源地址（外网视角） }
        local_ips:
          type: array
          items: { type: string }
          description: Agent 注册上报的本机网卡地址（内网视角，IPv4 在前）
        os_version: { type: string, description: 具体版本（Windows 10 22H2 / Ubuntu 24.04.3 LTS；未上报为空） }
        kernel: { type: string, description: 内核版本（10.0.19045 / 7.0.0-31-generic） }
        boot_at: { type: string, format: date-time, nullable: true, description: 开机时刻（由注册上报的 uptime 反推） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HostView:
      allOf:
        - $ref: "#/components/schemas/Host"
        - type: object
          properties:
            online: { type: boolean }
            last_seen: { type: string, format: date-time, nullable: true }
            stale: { type: boolean }
            agent_id: { type: string, nullable: true, description: 关联 Agent 标识（最近注册的一个） }
            agent_version: { type: string, nullable: true }
            agent_elevated: { type: boolean, nullable: true, description: 关联 Agent 是否以管理员/root 运行 }
    CreateHost:
      type: object
      required: [hostname]
      properties:
        hostname: { type: string }
        conn_mode: { type: string, enum: [reverse, forward], default: reverse }
        addr: { type: string }
        tags: { type: array, items: { type: string } }
    UpdateHost:
      type: object
      required: [hostname]
      properties:
        hostname: { type: string }
        conn_mode: { type: string, enum: [reverse, forward] }
        addr: { type: string }
        tags: { type: array, items: { type: string } }
        os: { type: string }
        arch: { type: string }
        platform: { type: string }
    Agent:
      type: object
      required: [id, host_id, version, online]
      properties:
        elevated: { type: boolean, description: agent 是否以管理员/root 权限运行 }
        id: { type: string }
        host_id: { type: string, format: uuid }
        version: { type: string }
        hostname: { type: string }
        registered_at: { type: string, format: date-time }
        last_heartbeat_at: { type: string, format: date-time, nullable: true }
        online: { type: boolean }
    CreateAgentGen:
      type: object
      required: [os, arch, listener_id]
      properties:
        os: { type: string, enum: [windows, linux, macos] }
        arch: { type: string, enum: [x86_64, aarch64] }
        listener_id: { type: string, format: uuid, description: 监听器（决定烙入的连入地址与注册 token） }
        conn_mode:
          type: string
          enum: [reverse, forward]
          default: reverse
          description: reverse=Agent 主动连 Server；forward=Agent 监听、Server 拨号
        listen_addr:
          type: string
          description: forward 模式监听地址（默认 0.0.0.0:50052）
        server_addr:
          type: string
          description: 覆盖连入地址（reverse 模式有效；留空由监听器地址推导，通配主机替换为服务器内网 IP）
    AgentGenJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        os: { type: string }
        arch: { type: string }
        triple: { type: string, description: Rust 目标三元组 }
        server_addr: { type: string, description: 烙入的 Server gRPC 地址 }
        conn_mode: { type: string, enum: [reverse, forward] }
        listen_addr: { type: string, description: forward 模式监听地址 }
        status: { type: string, enum: [compiling, ready, failed] }
        error: { type: string, nullable: true }
        file_size: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        log_tail:
          type: array
          items: { type: string }
          description: 编译日志尾部（详情查询返回，列表为空）
    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          properties:
            online: { type: boolean }
    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid, nullable: true }
        host_id: { type: string, format: uuid }
        status: { type: string }
        command: { type: string }
        args: { type: array, items: { type: string } }
        output: { type: string, nullable: true }
        exit_code: { type: integer, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    Metric:
      type: object
      properties:
        host_id: { type: string, format: uuid }
        name: { type: string }
        value: { type: number }
        labels: { type: object, additionalProperties: { type: string } }
        ts: { type: string, format: date-time }
    FileEntry:
      type: object
      properties:
        name: { type: string }
        is_dir: { type: boolean }
        size: { type: integer }
        modified_unix_ms: { type: integer }
        mode: { type: string }
    Listener:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        addr: { type: string }
        proto: { type: string, enum: [grpc] }
        status: { type: string, enum: [running, stopped] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateListener:
      type: object
      required: [name, addr]
      properties:
        name: { type: string }
        addr: { type: string }
        proto: { type: string, enum: [grpc], default: grpc }
        auth: { type: string }
    UpdateListener:
      type: object
      required: [name, addr]
      properties:
        name: { type: string }
        addr: { type: string }
        proto: { type: string, enum: [grpc] }
        auth: { type: string }
    Service:
      type: object
      properties:
        id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        name: { type: string }
        command: { type: string }
        args: { type: array, items: { type: string } }
        status: { type: string, enum: [running, stopped, failed] }
        restart_policy: { type: string, enum: ["no", "always"] }
        pid: { type: integer, nullable: true }
        exit_code: { type: integer, nullable: true }
        log: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateService:
      type: object
      required: [agent_id, name, command]
      properties:
        agent_id: { type: string }
        name: { type: string }
        command: { type: string }
        args: { type: array, items: { type: string } }
        restart_policy: { type: string, enum: ["no", "always"], default: "no" }
    UpdateService:
      type: object
      required: [name, command]
      properties:
        name: { type: string }
        command: { type: string }
        args: { type: array, items: { type: string } }
        restart_policy: { type: string, enum: ["no", "always"] }
    ProcessInfo:
      type: object
      properties:
        pid: { type: integer }
        name: { type: string }
        cpu_percent: { type: number }
        mem_bytes: { type: integer }
        virt_mem_bytes: { type: integer }
        parent_pid: { type: integer }
        status: { type: string }
        user: { type: string }
        start_time_unix: { type: integer }
        exe_path: { type: string }
        cmd: { type: string }
    NetInterface:
      type: object
      properties:
        name: { type: string }
        addrs:
          type: array
          items: { type: string }
        mac: { type: string }
        status: { type: string, description: up / down / ... }
        gateway: { type: string }
        kind: { type: string, description: ethernet / wifi / loopback / tunnel / other }
    NetConnection:
      type: object
      properties:
        protocol: { type: string, enum: [tcp, udp] }
        local: { type: string }
        remote: { type: string }
        state: { type: string }
        pid: { type: integer }
        process_name: { type: string }
    IrFinding:
      type: object
      properties:
        category: { type: string, description: 账户 / 登录 / 服务 / 驱动 / 计划任务 / 浏览器 / 外壳 / WMI 订阅 / 映像劫持 / 认证 / 事件日志 / 可疑文件 / hosts }
        name: { type: string }
        detail: { type: string }
        severity: { type: string, enum: [info, warn, critical] }
        path: { type: string, nullable: true, description: 关联可执行文件/DLL/脚本路径 }
        publisher: { type: string, nullable: true, description: 文件厂商（版本资源 CompanyName） }
        signState: { type: string, nullable: true, description: Authenticode 签名状态（含目录签名）：verified / unsigned / invalid / unknown }
        desc: { type: string, nullable: true, description: 条目描述（服务 DisplayName / CLSID 名等） }
        opKey: { type: string, nullable: true, description: 操作地址（disable/enable/delete 目标；空 = 不可操作） }
        disabled: { type: boolean, nullable: true, description: 是否处于 AutorunsDisabled 禁用态 }
        mtime: { type: string, nullable: true, description: 关联文件最后修改时间（unix 秒字符串） }

    IrSnapshotMeta:
      type: object
      properties:
        id: { type: string, format: uuid }
        agent_id: { type: string }
        label: { type: string }
        entry_count: { type: integer }
        created_at: { type: string }

    ProxyView:
      type: object
      properties:
        id: { type: string, format: uuid }
        agent_id: { type: string }
        listen_addr: { type: string }
        status: { type: string, enum: [running] }

    SysService:
      type: object
      properties:
        name: { type: string }
        display_name: { type: string }
        status: { type: string }
        start_type: { type: string }
        pid: { type: integer }
        description: { type: string }
        enabled_state: { type: string, description: systemd UnitFileState 原文（enabled/disabled/static/masked…）；非 systemd 为空 }
        since_unix: { type: integer, format: int64, description: 进入当前状态的时刻（unix 秒；0 = 未知） }
        unit_file: { type: string, description: systemd 单元文件路径；非 systemd 为空 }
    Audit:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor: { type: string }
        action: { type: string }
        resource: { type: string }
        detail: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        metric_name: { type: string }
        threshold: { type: number }
        value: { type: number }
        level: { type: string }
        created_at: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        kind: { type: string, enum: [online, offline, alert] }
        message: { type: string }
        read: { type: boolean }
        created_at: { type: string, format: date-time }

    ApiKey:
      type: object
      description: API key 视图（不含哈希；明文仅创建响应返回一次）
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, example: "helm_3f9a81c2" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/ApiKeyScope" }
          description: 功能域 scope；空 = 全功能

    ApiKeyScope:
      type: string
      enum: [hosts, exec, files, services, processes, metrics, notifications, listeners, forward, proxy, ir, agent-gen, audit]
      description: 功能域 scope（api-keys/账号管理永远 JWT-only，不设 scope）

    Account:
      type: object
      properties:
        username: { type: string }
        role: { type: string, enum: [admin, operator] }
        created_at: { type: string, format: date-time }

security:
  - bearerAuth: []
