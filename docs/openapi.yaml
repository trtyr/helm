openapi: 3.0.3
info:
  title: Helm 运维平台 API
  description: |
    Helm 控制面（Server）的完整 HTTP API 契约，覆盖控制台、Agent 生命周期、
    命令执行、文件、服务、监听器、实时流（WebSocket）与审计/告警端点。
    除 `/healthz`、`/auth/login`、`/agents/cert` 与 WebSocket 端点外，
    所有 `/api/v1` 端点均需 `Authorization: Bearer <JWT 或 API key>`（决策 010）。
    API key 为 `helm_` 前缀密钥；WebSocket 端点的 `?token=` 两种均可。
    api-keys 管理端点仅接受 JWT（key 不可自管）。
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发（端口可用 HELM_HTTP_ADDR 覆盖）
tags:
  - name: auth
    description: 认证
  - name: hosts
    description: 主机管理
  - name: agents
    description: Agent 生命周期
  - name: exec
    description: 命令执行
  - name: jobs
    description: Job 查询
  - name: metrics
    description: 指标与告警
  - name: files
    description: 文件传输
  - name: tasks
    description: 脚本与定时任务
  - name: forward
    description: 正向连接执行
  - name: listeners
    description: 监听器管理
  - name: services
    description: 常驻服务管理
  - name: process
    description: 进程与网络信息
  - name: audit
    description: 审计日志
  - name: api-keys
    description: API key 管理
  - name: stream
    description: 实时流（WebSocket）

paths:
  /healthz:
    get:
      tags: [auth]
      summary: 健康检查
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 控制台登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: 登录成功，返回 JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 当前账号（按 JWT sub 查库；仅 JWT，改名后旧 token 返回 401）
      responses:
        "200":
          description: 账号信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: "#/components/schemas/Account" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: 修改密码（校验当前密码；新密码 ≥ 6 字符；已有 JWT 不失效）
      responses:
        "200":
          description: 已修改
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/change-username:
    post:
      tags: [auth]
      summary: 修改用户名（校验当前密码；UNIQUE 查重；旧 token 的 sub 随即失效）
      responses:
        "200":
          description: 已修改（返回新用户名）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  username: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/agents/cert:
    post:
      tags: [agents]
      summary: Agent 提交 CSR 换 mTLS 证书（token 放 body，无需 JWT）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, token, csr_pem]
              properties:
                agent_id: { type: string }
                token: { type: string }
                csr_pem: { type: string }
      responses:
        "200":
          description: 签发成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  cert_pem: { type: string }
                  ca_cert_pem: { type: string }

  /api/v1/hosts:
    get:
      tags: [hosts]
      summary: 列出主机（附在线状态 + 最后心跳 + 超时标记；支持 tag 过滤与分页）
      parameters:
        - name: tag
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: 主机列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosts:
                    type: array
                    items: { $ref: "#/components/schemas/HostView" }
    post:
      tags: [hosts]
      summary: 创建主机
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHost" }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: { $ref: "#/components/schemas/Host" }

  /api/v1/hosts/{id}:
    parameters:
      - $ref: "#/components/parameters/HostId"
    get:
      tags: [hosts]
      summary: 查询单台主机（详情页单查）
      responses:
        "200":
          description: 主机详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: { $ref: "#/components/schemas/Host" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [hosts]
      summary: 更新主机
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateHost" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: { $ref: "#/components/schemas/Host" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [hosts]
      summary: 删除主机（软删除）
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/v1/hosts/{id}/tags:
    parameters:
      - $ref: "#/components/parameters/HostId"
    post:
      tags: [hosts]
      summary: 设置主机标签
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: 设置成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: { $ref: "#/components/schemas/Host" }

  /api/v1/agents:
    get:
      tags: [agents]
      summary: 列出已注册 Agent
      responses:
        "200":
          description: Agent 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }

  /api/v1/ir/scan:
    post:
      tags: [ir]
      summary: 应急响应基线扫描（账户/持久化/事件日志/可疑文件，Windows）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string }
                types:
                  type: array
                  items: { type: string, enum: [accounts, autostart, events, suspicious_files] }
                  description: 空 = 全部
      responses:
        "200":
          description: 发现列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items: { $ref: "#/components/schemas/IrFinding" }
                  error: { type: string, nullable: true }
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/ir/memscan:
    post:
      tags: [ir]
      summary: 进程内存字符串扫描（Volatility strings 简化版，需 SeDebugPrivilege）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, pid]
              properties:
                agent_id: { type: string }
                pid: { type: integer, description: 目标 PID；0 = 遍历全部进程（全局限额+60s 超时） }
                min_len: { type: integer, default: 6 }
                keyword: { type: string, description: 过滤关键词（空 = 不过滤） }
      responses:
        "200":
          description: 命中字符串
          content:
            application/json:
              schema:
                type: object
                properties:
                  pid: { type: integer }
                  matches: { type: array, items: { type: string } }
                  scanned_bytes: { type: integer }
                  truncated: { type: boolean }
                  error: { type: string, nullable: true }
                  pidsTotal: { type: integer, description: pid=0 全进程模式：枚举到的进程数 }
                  pidsScanned: { type: integer, description: 全进程模式：成功扫描的进程数 }

  /api/v1/ir/memscan/stream:
    post:
      tags: [ir]
      summary: 启动流式内存扫描（返回 scanId，随后订阅 WS /ir/memscan/{id}/stream 接收增量批次）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, pid, scan_id]
              properties:
                agent_id: { type: string }
                scan_id: { type: string, format: uuid, description: 客户端生成，先订阅 WS 再启动 }
                pid: { type: integer, description: 0 = 遍历全部进程 }
                min_len: { type: integer, default: 6 }
                keyword: { type: string }
      responses:
        "200":
          description: 扫描已启动
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanId: { type: string }

  /api/v1/ir/memscan/{id}/stream:
    get:
      tags: [ir]
      summary: 内存扫描实时流（WebSocket，query 传 token）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 升级为 WebSocket }

  /api/v1/exec/batch:
    post:
      tags: [exec]
      summary: 多主机批量命令下发（逐 agent 建 job，任务页跟踪）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_ids, command]
              properties:
                agent_ids: { type: array, items: { type: string } }
                command: { type: string }
                args: { type: array, items: { type: string } }
      responses:
        "200":
          description: 逐 agent 结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        agent_id: { type: string }
                        job_id: { type: string, nullable: true }
                        error: { type: string, nullable: true }

  /api/v1/ir/evidence:
    post:
      tags: [ir]
      summary: 证据包一键收集（JSON 附件下载：进程/网络/服务/自启动/日志/可疑文件）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string }
      responses:
        "200":
          description: 证据包 JSON 附件
          content:
            application/json:
              schema: { type: object }

  /api/v1/ir/fs-timeline:
    post:
      tags: [ir]
      summary: NTFS USN 文件时间线（按盘符 + 最近 N 小时，需管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string }
                drive: { type: string, default: C }
                since_hours: { type: integer, default: 24 }
                limit: { type: integer, default: 5000 }
                keyword: { type: string }
      responses:
        "200":
          description: 文件活动记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  drive: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        frn: { type: integer }
                        parentFrn: { type: integer }
                        tsUnix: { type: integer }
                        reason: { type: string }
                  totalScanned: { type: integer }
                  truncated: { type: boolean }
                  error: { type: string, nullable: true }

  /api/v1/ir/cache:
    get:
      tags: [ir]
      summary: 页面缓存（最后一次扫描结果，秒开）
      parameters:
        - { name: agent_id, in: query, required: true, schema: { type: string } }
        - { name: types, in: query, required: true, schema: { type: string }, description: 逗号分隔，如 autostart,registry 或 events }
      responses:
        "200":
          description: 缓存内容（findings 为 null = 无缓存）
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings: { type: array, nullable: true, items: { $ref: "#/components/schemas/IrFinding" } }
                  entryCount: { type: integer }
                  createdAt: { type: string }

  /api/v1/ir/autorun-action:
    post:
      tags: [ir]
      summary: 自启动项操作（禁用/启用/删除，AutorunsDisabled 机制）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, action, key]
              properties:
                agent_id: { type: string }
                action: { type: string, enum: [disable, enable, delete] }
                key: { type: string, description: 扫描结果中的 opKey 操作地址 }
      responses:
        "200":
          description: 操作结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: string, nullable: true }
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/ir/snapshots:
    post:
      tags: [ir]
      summary: 保存当前扫描为基线快照（现场扫描 autostart+registry）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string }
                label: { type: string }
      responses:
        "200":
          description: 快照 id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  entry_count: { type: integer }
        "400":
          $ref: "#/components/responses/InvalidArgument"
    get:
      tags: [ir]
      summary: 快照列表
      parameters:
        - { name: agent_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: 快照元数据列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items: { $ref: "#/components/schemas/IrSnapshotMeta" }

  /api/v1/ir/snapshots/compare:
    post:
      tags: [ir]
      summary: 基线对比（added = 目标有基线无；removed = 基线有目标无）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_id]
              properties:
                base_id: { type: string, format: uuid }
                target_id: { type: string, format: uuid, description: 与 agent_id 二选一 }
                agent_id: { type: string, description: 现场重扫作为对比目标（不入库） }
      responses:
        "200":
          description: 对比结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  base: { type: object }
                  target: { type: string }
                  added: { type: array, items: { $ref: "#/components/schemas/IrFinding" } }
                  removed: { type: array, items: { $ref: "#/components/schemas/IrFinding" } }
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/ir/snapshots/{id}:
    get:
      tags: [ir]
      summary: 快照详情（含 findings 全文）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 快照全文
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot: { type: object }
    delete:
      tags: [ir]
      summary: 删除快照
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 删除数量
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }

  /api/v1/proxies:
    get:
      tags: [proxy]
      summary: 列出活跃的 SOCKS5 代理
      responses:
        "200":
          description: 代理列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  proxies:
                    type: array
                    items: { $ref: "#/components/schemas/ProxyView" }
    post:
      tags: [proxy]
      summary: 为 agent 开启 SOCKS5 代理（Server 本地监听，流量经 agent 出站）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string }
                listen_addr:
                  type: string
                  default: 127.0.0.1:1080
                  description: SOCKS5 监听地址
      responses:
        "200":
          description: 代理已开启
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxyView" }
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/proxies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [proxy]
      summary: 停止并移除 SOCKS5 代理
      responses:
        "200":
          description: 已停止
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agent-gen:
    get:
      tags: [agents]
      summary: 列出 Agent 现场编译生成任务
      responses:
        "200":
          description: 生成任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/AgentGenJob" }
    post:
      tags: [agents]
      summary: 创建 Agent 生成任务（现场交叉编译，异步执行）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentGen" }
      responses:
        "200":
          description: 任务已创建（status=compiling，轮询 GET /agent-gen/{id} 取进度）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentGenJob" }
        "400":
          $ref: "#/components/responses/InvalidArgument"

  /api/v1/agent-gen/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [agents]
      summary: 查询生成任务进度（含编译日志尾部）
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentGenJob" }

  /api/v1/agent-gen/{id}/download:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [agents]
      summary: 下载编译完成的 Agent 二进制（任务就绪后可用）
      responses:
        "200":
          description: 二进制文件流（application/octet-stream 附件下载）
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      tags: [agents]
      summary: 查询 Agent 详情（附在线状态）
      responses:
        "200":
          description: Agent 详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: "#/components/schemas/AgentDetail" }
    delete:
      tags: [agents]
      summary: 注销 Agent（删 agent 行 + 孤儿主机软删）
      responses:
        "200":
          description: 注销成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/v1/agents/{id}/tags:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    put:
      tags: [agents]
      summary: 更新 Agent 关联主机的标签
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: { $ref: "#/components/schemas/Host" }

  /api/v1/agents/{id}/uninstall:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      tags: [agents]
      summary: 下发卸载指令（SelfDestruct，可选删除二进制）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remove_binary: { type: boolean, default: true }
      responses:
        "200":
          description: 指令已下发
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "409":
          $ref: "#/components/responses/NotConnected"

  /api/v1/agents/{id}/terminal:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - name: token
        in: query
        required: true
        schema: { type: string }
        description: JWT（WebSocket 握手无法带 Authorization header）
    get:
      tags: [stream]
      summary: 交互式会话终端（WebSocket，二进制帧双向流转）
      responses:
        "101":
          description: WebSocket 升级成功

  /api/v1/exec:
    post:
      tags: [exec]
      summary: 下发命令执行
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, command]
              properties:
                agent_id: { type: string }
                command: { type: string }
                args:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: 返回 job_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string, format: uuid }

  /api/v1/jobs:
    get:
      tags: [jobs]
      summary: 分页列出 Job（支持 status / host_id 过滤）
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          description: 按状态过滤（queued/running/succeeded/failed/cancelled/timed_out）
          schema: { type: string, enum: [queued, running, succeeded, failed, cancelled, timed_out] }
        - name: host_id
          in: query
          description: 按主机过滤
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          description: 排序（`field` 或 `field:desc`；白名单：started_at/status/host_id/exit_code/command，未命中回退 started_at DESC NULLS LAST）
          schema: { type: string }
      responses:
        "200":
          description: Job 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
                  total:
                    type: integer
                    description: 过滤条件下的总条数（P001-T4 分页栏）

  /api/v1/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      summary: 查询单个 Job
      responses:
        "200":
          description: Job 详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { $ref: "#/components/schemas/Job" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [jobs]
      summary: 取消 Job（EN-64）
      description: |
        queued → 直接收敛为 cancelled；running → 在线 agent 下发 JobCancel 真中断
        （杀目标机进程并回 ExecResult(cancelled=true)），离线则置 cancelled 并记补偿
        （agent 重连后补杀残留进程）。终态 job 返回 400。
      responses:
        "200":
          description: 已受理取消（cancelled 恒 true）
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: boolean }
                  delivered:
                    type: boolean
                    description: JobCancel 是否已送达在线 agent（真中断）
                  compensated:
                    type: boolean
                    description: agent 离线时是否已记补偿（重连后补杀）
        "400":
          description: job 已处于终态（invalid_argument）
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs/{id}/stream:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: token
        in: query
        required: true
        schema: { type: string }
    get:
      tags: [stream]
      summary: Job 输出实时流（WebSocket，二进制帧为输出增量）
      responses:
        "101":
          description: WebSocket 升级成功

  /mcp:
    post:
      tags: [mcp]
      summary: MCP JSON-RPC 2.0 端点（AI 接入，单工具 helm）
      description: |
        单工具 `helm`：`op` 渐进式调用（`catalog` 编目 → 逐 op loopback 透传既有 HTTP 面）。
        认证：JWT 或 API key（scope 裁剪，空 scopes = 全功能；api-keys/账号端点无 scope、
        永远 JWT-only）。请求体为 JSON-RPC 2.0 消息（initialize / tools/list / tools/call）；
        工具级错误亦返回 200 + isError。详见 engram projects/helm「接口契约/mcp」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0 请求（jsonrpc/id/method/params）
      responses:
        "200":
          description: JSON-RPC 2.0 响应
          content:
            application/json:
              schema:
                type: object
        "401":
          description: 未认证
        "403":
          description: scope 不足（fail-closed）

  /api/v1/metrics:
    get:
      tags: [metrics]
      summary: 查询指标（时序）
      responses:
        "200":
          description: 指标列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: array
                    items: { $ref: "#/components/schemas/Metric" }

  /api/v1/metrics/stream:
    get:
      tags: [stream]
      summary: 指标实时流（WebSocket，二进制帧为 JSON 指标点）
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: WebSocket 升级成功

  /api/v1/notifications/stream:
    get:
      tags: [stream]
      summary: 通知实时流（WebSocket，二进制帧为 JSON 通知；决策 009 系统内通知）
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: WebSocket 升级成功

  /api/v1/files/upload:
    post:
      tags: [files]
      summary: 上传文件到 Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, local_path, remote_path]
              properties:
                agent_id: { type: string }
                local_path: { type: string }
