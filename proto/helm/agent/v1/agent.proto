syntax = "proto3";

package helm.agent.v1;

import "helm/agent/v1/types.proto";

// AgentService 是 Agent 与 Server 之间的控制信道。
// 反向模式：Agent 作为 client 拨号 Server，调用 OpenChannel 建立双向流。
// 正向模式：Agent 作为 server 监听，Server 作为 client 调用 OpenChannel。
service AgentService {
  // 建立双向流，承载注册/心跳/状态/命令/文件全部信令。
  rpc OpenChannel(stream AgentMessage) returns (stream ServerMessage);
}

// 正向模式：Agent 作为 server 监听，Server 作为 client 拨号调用。
service ForwardAgentService {
  rpc OpenForwardChannel(stream ServerMessage) returns (stream AgentMessage);
}

// Agent → Server 的消息
message AgentMessage {
  oneof kind {
    Register register = 1;
    Heartbeat heartbeat = 2;
    MetricReport metric_report = 3;
    ExecResult exec_result = 4;
    FileChunk file_chunk = 5;
    FileStatus file_status = 6;
    SessionOpened session_opened = 7;
    SessionOutput session_output = 8;
    SessionClosed session_closed = 9;
    ServiceStatus service_status = 10;
    FileListResult file_list_result = 11;
    ProcessListResult process_list_result = 12;
    ProcessKillResult process_kill_result = 13;
    NetInfoResult net_info_result = 14;
    SysServiceListResult sys_service_list_result = 15;
    SysServiceActionResult sys_service_action_result = 16;
    ProxyConnected proxy_connected = 17;
    ProxyData proxy_data = 18;
    ProxyClose proxy_close = 19;
    IrScanResult ir_scan_result = 20;
    MemScanResult mem_scan_result = 21;
    AutorunsActionResult autoruns_action_result = 24;
    FileMetaResult file_meta_result = 25;
    FsTimelineResult fs_timeline_result = 26;
  }
}

// Server → Agent 的消息
message ServerMessage {
  oneof kind {
    RegisterAck register_ack = 1;
    ExecRequest exec_request = 2;
    FileRequest file_request = 3;
    MetricRequest metric_request = 4;
    FileChunk file_chunk = 5;  // upload 方向：Server 下发文件数据
    SelfDestruct self_destruct = 6;  // 卸载/自杀指令
    SessionOpen session_open = 7;
    SessionInput session_input = 8;
    SessionClose session_close = 9;
    SessionResize session_resize = 10;
    ServiceStart service_start = 11;
    ServiceStop service_stop = 12;
    FileList file_list = 13;
    ProcessList process_list = 14;
    ProcessKill process_kill = 15;
    NetInfo net_info = 16;
    SysServiceList sys_service_list = 17;
    SysServiceAction sys_service_action = 18;
    ProxyConnect proxy_connect = 19;
    ProxyClose proxy_close = 20;
    ProxyData proxy_data = 21;
    IrScan ir_scan = 22;
    MemScan mem_scan = 23;
    AutorunsAction autoruns_action = 24;
    FileMetaQuery file_meta_query = 25;
    FsTimelineQuery fs_timeline_query = 26;
    JobCancel job_cancel = 27;
  }
}

// 注册：Agent 连上后首条消息
message Register {
  string agent_id = 1;
  string token = 2;
  HostInfo host = 3;
  string version = 4;
}

message RegisterAck {
  bool ok = 1;
  string message = 2;
  uint32 heartbeat_interval_secs = 3;
}

// 心跳
message Heartbeat {
  uint64 timestamp_unix_ms = 1;
}

// 命令执行
message ExecRequest {
  string job_id = 1;
  string command = 2;
  repeated string args = 3;
  optional uint32 timeout_secs = 4;
  optional string working_dir = 5;
}

message ExecResult {
  string job_id = 1;
  StreamChunk chunk = 2;       // stdout/stderr 分块
  optional int32 exit_code = 3; // 结束时的退出码
  optional string error = 4;    // 执行失败信息
  bool finished = 5;            // 是否为最后一条
  bool cancelled = 6;           // true = 被 Server 取消（JobCancel 杀进程后上报）
  bool timed_out = 7;           // true = 执行超时被 agent 杀进程（timeout_secs）
}

// Server → Agent：取消一个执行中的 job（杀进程并回 ExecResult(cancelled=true)）。
message JobCancel {
  string job_id = 1;
}

// 指标采集
message MetricReport {
  repeated MetricPoint metrics = 1;
}

message MetricRequest {
  // 空消息，触发一次采集
}

// 文件传输
message FileRequest {
  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    DIRECTION_UPLOAD = 1;    // Server → Agent（下发到目标机）
    DIRECTION_DOWNLOAD = 2;  // Agent → Server（从目标机取回）
  }
  string transfer_id = 1;
  Direction direction = 2;
  string path = 3;
  uint64 size = 4;
  uint32 chunk_size = 5;
}

message FileChunk {
  string transfer_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message FileStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_PENDING = 1;
    STATE_TRANSFERRING = 2;
    STATE_DONE = 3;
    STATE_FAILED = 4;
  }
  string transfer_id = 1;
  State state = 2;
  uint64 bytes_transferred = 3;
  string error = 4;
  string checksum = 5;
}

// 流式输出分块
message StreamChunk {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_STDOUT = 1;
    KIND_STDERR = 2;
  }
  Kind kind = 1;
  bytes data = 2;
}

// 卸载/自杀指令：Agent 收到后停止、删除自身二进制、移除服务/自启。
message SelfDestruct {
  // 是否删除自身二进制文件（true = 完整卸载）。
  bool remove_binary = 1;
}

// 交互会话（PTY 终端）
// 打开会话：Agent 分配 PTY 并启动 shell。
message SessionOpen {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  string command = 4;  // 空则用默认 shell
}

// 会话输入：控制台 → Agent 写入 PTY 的字节。
message SessionInput {
  string session_id = 1;
  bytes data = 2;
}

// 关闭会话。
message SessionClose {
  string session_id = 1;
}

// 调整终端窗口大小。
message SessionResize {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

// Agent → Server：会话已打开。
message SessionOpened {
  string session_id = 1;
}

// Agent → Server：会话输出（PTY 读到的字节）。
message SessionOutput {
  string session_id = 1;
  bytes data = 2;
}

// Agent → Server：会话已关闭。
message SessionClosed {
  string session_id = 1;
  optional int32 exit_code = 2;
}

// 常驻服务/后台任务
// Server → Agent：启动一个常驻服务。
message ServiceStart {
  string service_id = 1;
  string command = 2;
  repeated string args = 3;
  string restart_policy = 4;  // "no" | "always"
}

// Server → Agent：停止常驻服务。
message ServiceStop {
  string service_id = 1;
}

// Agent → Server：服务状态 + 增量日志。
message ServiceStatus {
  string service_id = 1;
  string status = 2;  // "running" | "exited" | "failed"
  optional int32 pid = 3;
  optional int32 exit_code = 4;
  bytes log = 5;
}

// Server → Agent：列目录。
message FileList {
  string request_id = 1;
  string path = 2;
}

// 目录条目。
message FileEntry {
  string name = 1;
  bool is_dir = 2;
  uint64 size = 3;
  int64 modified_unix_ms = 4;
  string mode = 5;  // 权限字符串，如 "rw-r--r--"
}

// Agent → Server：目录内容。
message FileListResult {
  string request_id = 1;
  string path = 2;
  repeated FileEntry entries = 3;
  optional string error = 4;
}

// 进程信息。
message ProcessInfo {
  int32 pid = 1;
  string name = 2;
  float cpu_percent = 3;
  uint64 mem_bytes = 4;
  uint64 virt_mem_bytes = 5;    // 虚拟内存
  int32 parent_pid = 6;         // 父进程 PID（0 = 无）
  string status = 7;            // 运行态：Run / Sleep / Zombie / ...
  string user = 8;              // 属主用户名（未知为空）
  uint64 start_time_unix = 9;   // 启动时间（unix 秒，0 = 未知）
  string exe_path = 10;         // 可执行文件路径
  string cmd = 11;              // 完整命令行
}

// Server → Agent：列出进程。
message ProcessList {
  string request_id = 1;
}

// Agent → Server：进程列表。
message ProcessListResult {
  string request_id = 1;
  repeated ProcessInfo processes = 2;
}

// Server → Agent：终止进程。
message ProcessKill {
  string request_id = 1;
  int32 pid = 2;
}

// Agent → Server：终止结果。
message ProcessKillResult {
  string request_id = 1;
  int32 pid = 2;
  bool ok = 3;
  optional string error = 4;
}

// 网络接口（Windows 走 GetAdaptersAddresses 原生枚举，全量适配器）。
message NetInterface {
  string name = 1;
  repeated string addrs = 2;
  string mac = 3;        // 物理地址（如 00-1A-2B-3C-4D-5E），虚拟/回环可能为空
  string status = 4;     // up / down / ...（OperationalStatus）
  string gateway = 5;    // 默认网关（多个取首个）
  string kind = 6;       // 接口类型（ethernet / wifi / loopback / tunnel / other）
}

// 网络连接（TCP/UDP 会话表条目，netstat/ss 视角）。
message NetConnection {
  string protocol = 1;       // tcp / udp
  string local = 2;          // 本地地址 host:port
  string remote = 3;         // 远端地址 host:port（UDP 为 *:*）
  string state = 4;          // LISTENING / ESTABLISHED / ...（UDP 为空）
  int32 pid = 5;             // 归属进程 PID（0 = 未知/无权限）
  string process_name = 6;   // 归属进程名（空 = 未知）
}

// Server → Agent：采集网络信息。
message NetInfo {
  string request_id = 1;
}

// Agent → Server：网络信息。
message NetInfoResult {
  string request_id = 1;
  string hostname = 2;
  repeated NetInterface interfaces = 3;
  repeated NetConnection connections = 4;
}

// 系统服务（Windows Service / systemd unit / launchctl）。
message SysServiceEntry {
  string name = 1;          // 服务标识（sc name / unit 名 / label）
  string display_name = 2;  // 显示名
  string status = 3;        // running / stopped / 其他原生状态
  string start_type = 4;    // auto / manual / disabled / boot / system（未知为空）
  int32 pid = 5;            // 运行中进程 PID（0 = 未运行）
  string description = 6;   // 描述
  string enabled_state = 7; // systemd UnitFileState 原文（enabled/disabled/static/masked/…）；Windows/launchctl 为空
  uint64 since_unix = 8;    // 进入当前状态的时刻（unix 秒；0 = 未知）
  string unit_file = 9;     // systemd FragmentPath（单元文件路径）；Windows/launchctl 为空
}

// Server → Agent：枚举系统服务。
message SysServiceList {
  string request_id = 1;
}

// Agent → Server：系统服务列表。
message SysServiceListResult {
  string request_id = 1;
  repeated SysServiceEntry services = 2;
  optional string error = 3;
}

// Server → Agent：系统服务操作（start / stop / restart）。
message SysServiceAction {
  string request_id = 1;
  string name = 2;
  string action = 3;
}

// Agent → Server：操作结果。
message SysServiceActionResult {
  string request_id = 1;
  bool ok = 2;
  optional string error = 3;
}

// ---------------------------------------------------------------------------
// 代理隧道（SOCKS5 数据面）：Server 把本地 SOCKS5 端口的流量封装为 Proxy*
// 消息经 gRPC 通道转发给 Agent，Agent 从自身网络拨号目标并双向搬运数据。
// conn_id 关联一条虚拟连接；数据分块上限受 gRPC 消息大小约束（4MB）。
// ---------------------------------------------------------------------------

// Server → Agent：建立一条出站代理连接。
message ProxyConnect {
  string conn_id = 1;
  string target = 2;  // host:port
}

// Server → Agent：关闭一条代理连接。
message ProxyClose {
  string conn_id = 1;
}

// Agent → Server：代理连接数据块。
message ProxyData {
  string conn_id = 1;
  bytes data = 2;
}

// Agent → Server：代理连接建立结果（拨号成功/失败）。
message ProxyConnected {
  string conn_id = 1;
  bool ok = 2;
  optional string error = 3;
}

// ---------------------------------------------------------------------------
// 应急响应（IR）：Agent 侧采集主机安全基线（账户/持久化/事件日志/可疑文件）。
// ---------------------------------------------------------------------------

// Server → Agent：执行应急扫描。types 空表示全部：
// accounts | autostart | registry | events | suspicious_files
message IrScan {
  string request_id = 1;
  repeated string types = 2;
  // events 类型的可选参数：日志名（默认 System）/事件 ID 列表（逗号分隔）/条数
  string log_name = 3;
  string event_ids = 4;
  uint32 event_count = 5;
}

// 单条发现：severity = info | warn | critical。
// Autoruns 风格启动项：category = 登录/服务/驱动/计划任务/浏览器/外壳/WMI 订阅/映像劫持/认证。
message IrFinding {
  string category = 1;   // 账户 / 登录 / 服务 / 驱动 / 计划任务 / 浏览器 / 外壳 / WMI 订阅 / 映像劫持 / 认证 / 事件日志 / 可疑文件 / hosts / 引导执行 / 已知 DLL / Winsock / Office / 编解码器
  string name = 2;       // 条目名（用户名/注册表值名/服务名/事件头）
  string detail = 3;     // 详情（注册表位置/命令行/值，可多行）
  string severity = 4;
  optional string path = 5;        // 关联可执行文件/DLL/脚本路径
  optional string publisher = 6;   // 文件厂商：优先证书主体，回退版本资源 CompanyName
  optional string sign_state = 7;  // verified / unsigned / invalid / unknown
  optional string desc = 8;        // 条目描述（如服务 DisplayName / CLSID 名）
  optional string op_key = 9;      // 操作地址（disable/enable/delete 的目标），空 = 不可操作
  optional bool disabled = 10;     // 当前是否已处于禁用状态（AutorunsDisabled 机制）
  optional string mtime = 11;      // 关联文件最后修改时间（unix 秒字符串，空 = 未知）
  optional uint64 ts_unix = 14;    // 事件发生时间（unix 秒；系统日志类条目有值）
}

// Server → Agent：NTFS USN 文件时间线（应急取证：某盘符近 N 小时的文件活动）。
message FsTimelineQuery {
  string request_id = 1;
  string drive = 2;        // 盘符字母，如 "C"
  uint32 since_hours = 3;  // 只取最近 N 小时的记录（默认 24）
  uint32 limit = 4;        // 返回条数上限（默认 5000）
  string keyword = 5;      // 文件名关键词过滤（空 = 不过滤）
}

// Agent → Server：USN 时间线结果。
message FsTimelineEntry {
  string name = 1;        // 文件名
  uint64 frn = 2;         // 文件引用号（MFT 序号）
  uint64 parent_frn = 3;  // 父目录引用号
  uint64 ts_unix = 4;     // 最后更新时间（unix 秒）
  string reason = 5;      // 变更原因（枚举串，如 file_create / data_extend）
}
message FsTimelineResult {
  string request_id = 1;
  string drive = 2;
  repeated FsTimelineEntry entries = 3;
  uint32 total_scanned = 4;  // 枚举到的记录总数
  bool truncated = 5;
  optional string error = 6;
}

// Server → Agent：启动项操作（禁用/启用/删除，Autoruns 机制）。
message AutorunsAction {
  string request_id = 1;
  string action = 2;   // disable | enable | delete
  string op_key = 3;   // 扫描结果中的 opKey 操作地址
}

// Agent → Server：启动项操作结果。
message AutorunsActionResult {
  string request_id = 1;
  bool ok = 2;
  optional string error = 3;
}

// Server → Agent：文件元数据按需查询（SHA256/大小/mtime，供 VirusTotal 查杀）。
message FileMetaQuery {
  string request_id = 1;
  string path = 2;
}

// Agent → Server：文件元数据结果。
message FileMetaResult {
  string request_id = 1;
  string path = 2;
  string sha256 = 3;
  uint64 size = 4;
  string mtime = 5;             // unix 秒字符串
  optional string error = 6;
}

// Agent → Server：扫描结果。
message IrScanResult {
  string request_id = 1;
  repeated IrFinding findings = 2;
  optional string error = 3;
}

// Server → Agent：进程内存字符串扫描（多关键词/超时/区域统计）。
message MemScan {
  string request_id = 1;
  int32 pid = 2;
  uint32 min_len = 3;    // 字符串最小长度（默认 6）
  string keywords = 4;   // 逗号分隔多关键词（空 = 不过滤）
  uint32 timeout_secs = 5; // 扫描超时（0 = 默认 30s）
  bool stream = 6;       // 流式模式：逐进程推送部分批次（MemScanResult.finished=false），结束帧 finished=true
}

// 单条结构化命中：虚拟地址 + 编码 + 值。
message MemMatch {
  string addr = 1;      // 命中虚拟地址（hex）
  string kind = 2;      // ascii | utf16
  string value = 3;     // 字符串值（截断至 200 字符）
}

// Agent → Server：内存扫描结果。
message MemScanResult {
  string request_id = 1;
  int32 pid = 2;
  repeated string matches = 3;   // 兼容保留：纯文本命中
  uint64 scanned_bytes = 4;
  bool truncated = 5;            // 命中数达上限被截断
  optional string error = 6;
  repeated MemMatch hits = 7;    // 结构化命中
  uint32 regions_total = 8;      // 提交区域总数
  uint32 regions_scanned = 9;    // 实际扫描区域数
  bool timed_out = 10;           // 扫描超时提前返回
  uint32 pids_total = 11;        // 全进程模式（pid=0）：枚举到的进程数
  uint32 pids_scanned = 12;      // 全进程模式：成功扫描的进程数
  bool finished = 13;            // 流式模式：true = 最终帧（非流式恒为 true）
}
