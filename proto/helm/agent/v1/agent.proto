syntax = "proto3";

package helm.agent.v1;

import "helm/agent/v1/types.proto";

// AgentService 是 Agent 与 Server 之间的控制信道。
// 反向模式：Agent 作为 client 拨号 Server，调用 OpenChannel 建立双向流。
// 正向模式：Agent 作为 server 监听，Server 作为 client 调用 OpenChannel。
service AgentService {
  // 建立双向流，承载注册/心跳/状态/命令/文件全部信令。
  rpc OpenChannel(stream AgentMessage) returns (stream ServerMessage);
}

// 正向模式：Agent 作为 server 监听，Server 作为 client 拨号调用。
service ForwardAgentService {
  rpc OpenForwardChannel(stream ServerMessage) returns (stream AgentMessage);
}

// Agent → Server 的消息
message AgentMessage {
  oneof kind {
    Register register = 1;
    Heartbeat heartbeat = 2;
    MetricReport metric_report = 3;
    ExecResult exec_result = 4;
    FileChunk file_chunk = 5;
    FileStatus file_status = 6;
    SessionOpened session_opened = 7;
    SessionOutput session_output = 8;
    SessionClosed session_closed = 9;
    ServiceStatus service_status = 10;
    FileListResult file_list_result = 11;
    ProcessListResult process_list_result = 12;
    ProcessKillResult process_kill_result = 13;
    NetInfoResult net_info_result = 14;
    SysServiceListResult sys_service_list_result = 15;
    SysServiceActionResult sys_service_action_result = 16;
  }
}

// Server → Agent 的消息
message ServerMessage {
  oneof kind {
    RegisterAck register_ack = 1;
    ExecRequest exec_request = 2;
    FileRequest file_request = 3;
    MetricRequest metric_request = 4;
    FileChunk file_chunk = 5;  // upload 方向：Server 下发文件数据
    SelfDestruct self_destruct = 6;  // 卸载/自杀指令
    SessionOpen session_open = 7;
    SessionInput session_input = 8;
    SessionClose session_close = 9;
    SessionResize session_resize = 10;
    ServiceStart service_start = 11;
    ServiceStop service_stop = 12;
    FileList file_list = 13;
    ProcessList process_list = 14;
    ProcessKill process_kill = 15;
    NetInfo net_info = 16;
    SysServiceList sys_service_list = 17;
    SysServiceAction sys_service_action = 18;
  }
}

// 注册：Agent 连上后首条消息
message Register {
  string agent_id = 1;
  string token = 2;
  HostInfo host = 3;
  string version = 4;
}

message RegisterAck {
  bool ok = 1;
  string message = 2;
  uint32 heartbeat_interval_secs = 3;
}

// 心跳
message Heartbeat {
  uint64 timestamp_unix_ms = 1;
}

// 命令执行
message ExecRequest {
  string job_id = 1;
  string command = 2;
  repeated string args = 3;
  optional uint32 timeout_secs = 4;
  optional string working_dir = 5;
}

message ExecResult {
  string job_id = 1;
  StreamChunk chunk = 2;       // stdout/stderr 分块
  optional int32 exit_code = 3; // 结束时的退出码
  optional string error = 4;    // 执行失败信息
  bool finished = 5;            // 是否为最后一条
}

// 指标采集
message MetricReport {
  repeated MetricPoint metrics = 1;
}

message MetricRequest {
  // 空消息，触发一次采集
}

// 文件传输
message FileRequest {
  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    DIRECTION_UPLOAD = 1;    // Server → Agent（下发到目标机）
    DIRECTION_DOWNLOAD = 2;  // Agent → Server（从目标机取回）
  }
  string transfer_id = 1;
  Direction direction = 2;
  string path = 3;
  uint64 size = 4;
  uint32 chunk_size = 5;
}

message FileChunk {
  string transfer_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message FileStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_PENDING = 1;
    STATE_TRANSFERRING = 2;
    STATE_DONE = 3;
    STATE_FAILED = 4;
  }
  string transfer_id = 1;
  State state = 2;
  uint64 bytes_transferred = 3;
  string error = 4;
  string checksum = 5;
}

// 流式输出分块
message StreamChunk {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_STDOUT = 1;
    KIND_STDERR = 2;
  }
  Kind kind = 1;
  bytes data = 2;
}

// 卸载/自杀指令：Agent 收到后停止、删除自身二进制、移除服务/自启。
message SelfDestruct {
  // 是否删除自身二进制文件（true = 完整卸载）。
  bool remove_binary = 1;
}

// 交互会话（PTY 终端）
// 打开会话：Agent 分配 PTY 并启动 shell。
message SessionOpen {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  string command = 4;  // 空则用默认 shell
}

// 会话输入：控制台 → Agent 写入 PTY 的字节。
message SessionInput {
  string session_id = 1;
  bytes data = 2;
}

// 关闭会话。
message SessionClose {
  string session_id = 1;
}

// 调整终端窗口大小。
message SessionResize {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

// Agent → Server：会话已打开。
message SessionOpened {
  string session_id = 1;
}

// Agent → Server：会话输出（PTY 读到的字节）。
message SessionOutput {
  string session_id = 1;
  bytes data = 2;
}

// Agent → Server：会话已关闭。
message SessionClosed {
  string session_id = 1;
  optional int32 exit_code = 2;
}

// 常驻服务/后台任务
// Server → Agent：启动一个常驻服务。
message ServiceStart {
  string service_id = 1;
  string command = 2;
  repeated string args = 3;
  string restart_policy = 4;  // "no" | "always"
}

// Server → Agent：停止常驻服务。
message ServiceStop {
  string service_id = 1;
}

// Agent → Server：服务状态 + 增量日志。
message ServiceStatus {
  string service_id = 1;
  string status = 2;  // "running" | "exited" | "failed"
  optional int32 pid = 3;
  optional int32 exit_code = 4;
  bytes log = 5;
}

// Server → Agent：列目录。
message FileList {
  string request_id = 1;
  string path = 2;
}

// 目录条目。
message FileEntry {
  string name = 1;
  bool is_dir = 2;
  uint64 size = 3;
  int64 modified_unix_ms = 4;
  string mode = 5;  // 权限字符串，如 "rw-r--r--"
}

// Agent → Server：目录内容。
message FileListResult {
  string request_id = 1;
  string path = 2;
  repeated FileEntry entries = 3;
  optional string error = 4;
}

// 进程信息。
message ProcessInfo {
  int32 pid = 1;
  string name = 2;
  float cpu_percent = 3;
  uint64 mem_bytes = 4;
  uint64 virt_mem_bytes = 5;    // 虚拟内存
  int32 parent_pid = 6;         // 父进程 PID（0 = 无）
  string status = 7;            // 运行态：Run / Sleep / Zombie / ...
  string user = 8;              // 属主用户名（未知为空）
  uint64 start_time_unix = 9;   // 启动时间（unix 秒，0 = 未知）
  string exe_path = 10;         // 可执行文件路径
  string cmd = 11;              // 完整命令行
}

// Server → Agent：列出进程。
message ProcessList {
  string request_id = 1;
}

// Agent → Server：进程列表。
message ProcessListResult {
  string request_id = 1;
  repeated ProcessInfo processes = 2;
}

// Server → Agent：终止进程。
message ProcessKill {
  string request_id = 1;
  int32 pid = 2;
}

// Agent → Server：终止结果。
message ProcessKillResult {
  string request_id = 1;
  int32 pid = 2;
  bool ok = 3;
  optional string error = 4;
}

// 网络接口（Windows 走 GetAdaptersAddresses 原生枚举，全量适配器）。
message NetInterface {
  string name = 1;
  repeated string addrs = 2;
  string mac = 3;        // 物理地址（如 00-1A-2B-3C-4D-5E），虚拟/回环可能为空
  string status = 4;     // up / down / ...（OperationalStatus）
  string gateway = 5;    // 默认网关（多个取首个）
  string kind = 6;       // 接口类型（ethernet / wifi / loopback / tunnel / other）
}

// 网络连接（TCP/UDP 会话表条目，netstat/ss 视角）。
message NetConnection {
  string protocol = 1;       // tcp / udp
  string local = 2;          // 本地地址 host:port
  string remote = 3;         // 远端地址 host:port（UDP 为 *:*）
  string state = 4;          // LISTENING / ESTABLISHED / ...（UDP 为空）
  int32 pid = 5;             // 归属进程 PID（0 = 未知/无权限）
  string process_name = 6;   // 归属进程名（空 = 未知）
}

// Server → Agent：采集网络信息。
message NetInfo {
  string request_id = 1;
}

// Agent → Server：网络信息。
message NetInfoResult {
  string request_id = 1;
  string hostname = 2;
  repeated NetInterface interfaces = 3;
  repeated NetConnection connections = 4;
}

// 系统服务（Windows Service / systemd unit / launchctl）。
message SysServiceEntry {
  string name = 1;          // 服务标识（sc name / unit 名 / label）
  string display_name = 2;  // 显示名
  string status = 3;        // running / stopped / 其他原生状态
  string start_type = 4;    // auto / manual / disabled / boot / system（未知为空）
  int32 pid = 5;            // 运行中进程 PID（0 = 未运行）
  string description = 6;   // 描述
}

// Server → Agent：枚举系统服务。
message SysServiceList {
  string request_id = 1;
}

// Agent → Server：系统服务列表。
message SysServiceListResult {
  string request_id = 1;
  repeated SysServiceEntry services = 2;
  optional string error = 3;
}

// Server → Agent：系统服务操作（start / stop / restart）。
message SysServiceAction {
  string request_id = 1;
  string name = 2;
  string action = 3;
}

// Agent → Server：操作结果。
message SysServiceActionResult {
  string request_id = 1;
  bool ok = 2;
  optional string error = 3;
}
